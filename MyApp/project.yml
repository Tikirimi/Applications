name: MyApp
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.2"
targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - Sources/MyApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourname.myapp
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEVELOPMENT_TEAM: ""
    entitlements:
      path: MyApp.entitlements
